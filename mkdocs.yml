site_name: Toketam
theme:
  name: material
  language: fr
  logo: assets/symbole.png
repo_url: https://github.com/stephane-robin/toketam.git

# configuration de blocs de code
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# definition du menu
nav:
  - Accueil: index.md 
  - Puissances: puissances.md 
  - Racines: racines.md

# feuille de style
extra_css:
  - stylesheets/extra.css

# traduit le html de la page
markdown_extensions:
  - attr_list
  - md_in_html

# copyright du footer
extra:
  generator: false

copyright: <p>S. Robin — made with <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a></p>

